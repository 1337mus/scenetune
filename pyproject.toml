[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "product-scene-editor"
version = "0.1.0"
description = "A measured reference-image editing experiment on original synthetic products"
requires-python = ">=3.12,<3.13"
dependencies = ["pillow>=12,<13"]

[project.optional-dependencies]
control = ["modal==1.6.1"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "mypy>=1.15,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/product_scene_editor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
